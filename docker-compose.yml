services:
  db:
    image: postgres:16-alpine
    container_name: psalter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: psalter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - psalter_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"

volumes:
  psalter_db_data:
